# ---------------------------------------------------------------
# Site-wide configuration.
# Edit these values, then push to main - the site rebuilds itself.
# ---------------------------------------------------------------

# IMPORTANT: set this to your real GitHub Pages URL (or custom domain),
# no trailing slash. Used for canonical links, sitemap.xml, and Open Graph tags.
site_url: "https://www.cubicthegame.com"

site_name: "Cubic"
studio_name: "Twin Turtle Games"
tagline: "Explore a mysterious post-human world. Solve puzzles by combining and rearranging cubes. Find your other half."
contact_email: "contact.twinturtlegames@gmail.com"

# Social + store links
links:
  steam: "https://store.steampowered.com/app/3037080/Cubic"
  discord: "https://discord.com/invite/W6vzChE5JC"
  youtube: "https://www.youtube.com/watch?v=E4wOiwcpgao"
  twitter: "https://x.com/vwarrior99"
  instagram: "https://www.instagram.com/cubicthegame"

trailer_youtube_id: "E4wOiwcpgao"

# Real publish date of the trailer video on YouTube (YYYY-MM-DD). Used in the
# VideoObject structured data on the homepage - Google uses this for video
# search results, so keep it accurate.
trailer_upload_date: "2026-06-27"

# Fallback image used for Open Graph / Twitter Card previews on pages that
# don't have a more specific image of their own (e.g. the homepage itself).
default_og_image: "/assets/images/screenshots/keyart1.png"

# Descriptive alt text / SEO captions for each screenshot, keyed by filename.
# Used as the image's alt text when screenshots are displayed. Image sitemap
# entries contain URLs only. Any screenshot not listed here falls back to a generic
# "Cubic - screenshot" caption, so this is safe to leave partially filled in.
screenshot_captions:
  keyart1.png: "Cubic keyart - the land of Cubic with logo and the man made of cubes."
  News_2.png: "Cubic keyart - blueprint version of the land of Cubic and the man made of cubes."

